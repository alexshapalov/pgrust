# PGX ephemeral profile — Phase 1A, configuration only (no engine changes).
#
# For a database that lives for one agent task, test run or CI job and is
# recreated rather than recovered. Appended to postgresql.conf after initdb.
# Measured effect of each line: docs/pgx/phase1a-config.md.

# --- Fixed instance cost (idle memory and threads) -------------------------
# No pre-spawned parallel-query worker pool (16 parked threads, ~13 MB).
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
# No morsel-runtime worker pool (cores + 2 threads, ~12 MB).
pgrust.runtime = off
# Buffer pool and WAL buffers sized for small, short-lived data (~12 MB).
shared_buffers = 16MB
wal_buffers = 64kB
# Connection slots for one agent or test run, not a service (~4.5 MB).
max_connections = 20

# --- Storage ------------------------------------------------------------------
# New databases share blocks with their template instead of copying it
# (clonefile on APFS, copy_file_range on Linux). Needs a filesystem with
# block cloning; see docs/pgx/cow-cloning.md.
file_copy_method = clone

# --- Autovacuum at density --------------------------------------------------
# Pass over databases with no inserts, updates or deletes since their last
# visit, and visit each database every 5 minutes instead of every minute.
# 1000 idle databases: 5.4 % of a core -> 0.33 % (autovacuum off: 0.22 %);
# databases that change are still vacuumed and analyzed.
# docs/pgx/linux-analyze.md, docs/pgx/linux-density.md.
pgrust.autovacuum_skip_idle_databases = on
autovacuum_naptime = 300

# --- Replication / production-only -----------------------------------------
wal_level = minimal
max_wal_senders = 0
max_replication_slots = 0
max_logical_replication_workers = 0
hot_standby = off

# --- Durability: a crashed ephemeral database is discarded ------------------
fsync = off
synchronous_commit = off
full_page_writes = off
